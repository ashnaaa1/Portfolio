    <section id="contact-section">
        <div class="form-container">
            <h2><i class="fas fa-envelope"></i> Send me a Message</h2>
            <p style="text-align: center; margin-bottom: 2rem; color: #666;">
                Feel free to reach out! I'd love to hear from you.
            </p>
            
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Your Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="subject"><i class="fas fa-tag"></i> Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="Message subject">
                </div>

                <div class="form-group">
                    <label for="message"><i class="fas fa-comment"></i> Your Message</label>
                    <textarea id="message" name="message" required placeholder="Write your message here..." rows="6"></textarea>
                </div>

                <input type="submit" value="Send Message">
            </form>
        </div>
    </section>
